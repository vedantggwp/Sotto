name: Bug Report
description: Report reproducible Sotto behavior that is not working
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Include app mode, command or dictation flow, and permission state.
      placeholder: |
        1. Launch ...
        2. Grant/deny ...
        3. Say ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS Version
      placeholder: "15.x, 14.x"
  - type: input
    id: python
    attributes:
      label: Python Version
      placeholder: "3.10, 3.11, 3.12"
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Tauri app
        - Python CLI
        - Sidecar only
        - Other
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy Check
      options:
        - label: I have not included private recordings, transcripts, credentials, or sensitive logs.
          required: true
