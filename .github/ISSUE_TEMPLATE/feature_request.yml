name: Feature Request
description: Suggest a focused improvement for Sotto
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What voice, dictation, or app workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Sotto do differently?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - voice commands
        - dictation
        - permissions
        - frontend
        - sidecar / IPC
        - packaging
        - docs
        - tests
        - other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy Check
      options:
        - label: I have not included private recordings, transcripts, credentials, or sensitive logs.
          required: true
